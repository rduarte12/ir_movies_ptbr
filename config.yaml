# Configuração do buscador de filmes PT-BR.
# Fonte de verdade para todos os parâmetros (sem números mágicos no código).
# Decisões relacionadas: D-003, D-004, D-013, D-014, D-015.

snapshot:
  target_size: 20000         # D-003: filmes aceitos
  min_overview_words: 5      # D-004
  min_vote_count: 2          # D-004
  exclude_adult: true        # D-004 (adendo, aceita)
  checkpoint_interval: 500   # D-024: flush a cada N candidatos processados

tmdb:
  language: "pt-BR"          # D-002
  max_concurrency: 4         # proposta; ajustar na Sprint 1 após ler limites da TMDB
  retry:
    max_attempts: 3
    backoff_factor: 1.0
  rate_limit_rps: 30          # D-023: conservador (~metade do limite real de ~40 req/s)
  poster_size: "w342"        # proposta; verificar tamanhos na doc da TMDB (Sprint 1)

text:
  stemmer: "snowball_pt"     # D-014; Q-003 resolvida
  extra_stopwords: []        # Q-004: manter filme/filmes no vocabulário
  strip_accents: true        # D-014

tfidf:
  ngram_range: [1, 1]        # D-015
  norm: "l2"                 # D-015
  smooth_idf: true           # D-015
  sublinear_tf: false        # D-015
  min_df: 1                  # D-015; Q-004 resolvida

search:
  top_k: 20                  # resultados por busca quando k=None (D-090, D-037)

logging:
  dir: "logs"                # D-030: no Colab, o autor baixa os arquivos à mão; nunca vai ao git
  enabled: true              # false: nada é criado nem escrito (D-033)

semantic:
  enabled: true              # D-098: true para medir latencia (PASSO 4)
  model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # D-093
  revision: "e8f8c211226b894fcb81acc59f3b34ba3efd5f42"  # D-093: commit fixado (PASSO 4)
  embeddings_dir: "data"     # D-094: pasta para .npy e .json (relativo à raiz do projeto)
  candidates: 20             # D-096: top-k semântico antes do RRF
  rrf_k: 60                  # D-095: parâmetro k do RRF (Cormack 2009)
  batch_size: 32             # tamanho do lote para build_embeddings.py

ui:
  app_name: "FilmUSP"        # D-050: Q-005 resolvida
  grid_columns: 5            # ui_spec.md secao 1.3: grade de pôsteres
  score_decimals: 3          # ui_spec.md secao 3: mesma convenção nos 3 níveis
  highlight_levels: 4        # D-051: faixas de cor do destaque na sinopse
  rare_idf_threshold: 3.3    # D-053: idf >= limiar -> selo "palavra rara"
  max_examples: 6            # D-060: quantos exemplos clicáveis a tela mostra
  examples:                  # D-060; os dois primeiros vêm de ui_spec.md secao 1.2
    - "um tubarão assustador na praia"
    - "robô que se apaixona"
    - "viagem ao espaço com astronauta brasileira"
    - "amigos presos numa ilha deserta"
